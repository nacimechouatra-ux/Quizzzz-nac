.top{display:flex;justify-content:space-between;gap:8px;font-size:15px;color:var(--mut)}
.bar{height:12px;background:var(--panel);border-radius:9px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:var(--acc);width:100%}
.q{background:var(--panel);border-radius:18px;padding:22px 18px;font-size:clamp(20px,4.6vw,28px);font-weight:700;text-align:center;min-height:110px;display:grid;place-items:center;margin-bottom:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:0;border-radius:14px;min-height:96px;padding:12px;color:#fff;font-weight:700;font-size:clamp(15px,3.8vw,20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.28);text-align:center}

.o0{background:var(--c0)}.o1{background:var(--c1)}.o2{background:var(--c2);color:#1d1238}.o3{background:var(--c3)}
.opt.dim{opacity:.35}
.opt.good{outline:4px solid var(--ink);outline-offset:2px}
.fb{text-align:center;font-size:22px;font-weight:800;margin-top:16px}
.ok{color:#58d68d}.ko{color:#ff7b80}
.mid{text-align:center;padding-top:6vh}
.big{font-size:clamp(56px,18vw,100px);font-weight:800;line-height:1}
.qr{background:#fff;border-radius:16px;padding:8px;width:min(60vw,260px);margin:16px auto}
.qr svg{display:block;width:100%;height:auto}
.hint{font-size:14px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.chip{background:var(--panel);border:2px solid transparent;border-radius:999px;padding:8px 14px;font-size:15px}

<h1>Quiz</h1><p>30 questions par partie, ${T} secondes pour répondre. Plus tu réponds vite, plus tu marques de points.</p><p class="hint">Chaque partie mélange 10 thèmes : diversité, manga, histoire, sport, cinéma, culture générale, sciences, médecine, géographie et capitales.</p>
<button class="go" onclick="start()">Commencer</button>
${JOIN_URL?`<div class="qr">${qrSvg(JOIN_URL)}</div><p class="hint">Scanne ce QR code pour jouer sur ton téléphone.</p>`:""}</div>`;
}
function start(){
  const pool=Object.keys(B).flatMap(c=>shuf(B[c]).slice(0,3).map(x=>[...x,c]));G={qs:shuf(pool).slice(0,30).map(q=>({q:q[0],c:q[3],o:shuf(q[1].map((t,i)=>[t,i===q[2]]))})),i:0,s:0,ok:0};
  ask();
}
function ask(){
  const q=G.qs[G.i];G.t0=Date.now();G.done=false;
  app.innerHTML=`<div class="top"><span>Question ${G.i+1} sur ${G.qs.length} – ${esc(q.c)}</span><span>${G.s} pts</span></div><div class="bar" aria-hidden="true"><i id="bar"></i></div>
<div class="q">${esc(q.q)}</div><div class="opts" id="opts">${q.o.map((o,k)=>`<button class="opt o${k}" onclick="pick(${k})"><b aria-hidden="true">${SH[k]}</b>${esc(o[0])}</button>`).join("")}</div><div id="fb" aria-live="polite"></div>`;
  clearInterval(tm);
  tm=setInterval(()=>{const e=(Date.now()-G.t0)/1000,b=document.getElementById("bar");if(b)b.style.width=Math.max(0,100-e/T*100)+"%";if(e>=T)pick(-1)},100);
}
function pick(k){
  if(G.done)return;G.done=true;clearInterval(tm);
  const q=G.qs[G.i],e=Math.min((Date.now()-G.t0)/1000,T),ok=k>=0&&q.o[k][1],p=ok?Math.round(500+500*(1-e/T)):0;
  G.s+=p;if(ok)G.ok++;
  document.getElementById("opts").innerHTML=q.o.map((o,j)=>`<div class="opt o${j} ${o[1]?"good":"dim"}"><b aria-hidden="true">${SH[j]}</b>${esc(o[0])}</div>`).join("");
  document.getElementById("fb").innerHTML=`<p class="fb ${ok?"ok":"ko"}">${ok?"Bonne réponse ! +"+p:k<0?"Temps écoulé":"Raté…"}</p><button class="go" onclick="next()">${G.i+1<G.qs.length?"Question suivante":"Voir mon score"}</button>`;
}
function next(){G.i++;G.i<G.qs.length?ask():end()}
function end(){
  const n=G.qs.length,m=G.ok/n,t=m>=.9?"Expert·e de la diversité !":m>=.7?"Très bien joué !":m>=.5?"Bon début, vous progressez !":"Une bonne occasion d’apprendre !";
  app.innerHTML=`<div class="mid"><h1>${t}</h1><div class="big">${G.s}</div><p>points – ${G.ok} bonnes réponses sur ${n}</p>
<button class="go" onclick="start()">Rejouer</button><button class="go alt" onclick="share()">Copier mon score</button><p class="hint" id="cp" aria-live="polite"></p></div>`;
}
async function share(){
  const t=`J’ai marqué ${G.s} points au Quiz (${G.ok}/${G.qs.length} bonnes réponses)`+(JOIN_URL?" : "+JOIN_URL:"");
  let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  document.getElementById("cp").textContent=ok?"Score copié, colle-le où tu veux.":t;
}
home();
</script>
</body>
</html>
